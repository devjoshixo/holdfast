<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Inter, Helvetica Neue, Arial, sans-serif">
<rect width="1200" height="675" fill="#fcfcfb"/>
<text x="90" y="50" font-size="30" font-weight="700" fill="#0b0b0b">One booking endpoint, three concurrency mechanisms</text>
<text x="90" y="78" font-size="17" fill="#52514e">p99 latency as the seat pool shrinks &#8212; 30,000 concurrent requests, all three provably correct. Lower is better.</text>
<line x1="110" y1="570.0" x2="980" y2="570.0" stroke="#e8e7e2" stroke-width="1"/>
<text x="98" y="575.0" font-size="14" fill="#8a8880" text-anchor="end">0s</text>
