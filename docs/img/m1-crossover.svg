<text x="972" y="441.1" font-size="18" font-weight="600" fill="#2a78d6">CAS</text>
<text x="972" y="297.7" font-size="18" font-weight="600" fill="#eb6834">Constraint</text>
<text x="972" y="325.6" font-size="18" font-weight="600" fill="#1baf7a">Row lock</text>
<text x="150" y="522" font-size="16" font-style="italic" fill="#52514e">The row lock starts best and reverses as demand concentrates &#8212; its losers all queue on the same row.</text>
</svg>