<text x="98" y="508.6" font-size="14" fill="#8a8880" text-anchor="end">1s</text>
<line x1="110" y1="437.1" x2="980" y2="437.1" stroke="#e8e7e2" stroke-width="1"/>
<text x="98" y="442.1" font-size="14" fill="#8a8880" text-anchor="end">2s</text>
<line x1="110" y1="370.7" x2="980" y2="370.7" stroke="#e8e7e2" stroke-width="1"/>
<text x="98" y="375.7" font-size="14" fill="#8a8880" text-anchor="end">3s</text>
<line x1="110" y1="304.3" x2="980" y2="304.3" stroke="#e8e7e2" stroke-width="1"/>
<text x="98" y="309.3" font-size="14" fill="#8a8880" text-anchor="end">4s</text>
<line x1="110" y1="237.9" x2="980" y2="237.9" stroke="#e8e7e2" stroke-width="1"/>
<text x="98" y="242.9" font-size="14" fill="#8a8880" text-anchor="end">5s</text>
<line x1="110" y1="171.4" x2="980" y2="171.4" stroke="#e8e7e2" stroke-width="1"/>
<text x="98" y="176.4" font-size="14" fill="#8a8880" text-anchor="end">6s</text>
<line x1="110" y1="105.0" x2="980" y2="105.0" stroke="#e8e7e2" stroke-width="1"/>
<text x="98" y="110.0" font-size="14" fill="#8a8880" text-anchor="end">7s</text>
<text x="150.0" y="604" font-size="17" fill="#52514e" text-anchor="middle">10,000</text>
<text x="416.7" y="604" font-size="17" fill="#52514e" text-anchor="middle">1,000</text>
<text x="683.3" y="604" font-size="17" fill="#52514e" text-anchor="middle">100</text>
<text x="950.0" y="604" font-size="17" fill="#52514e" text-anchor="middle">10</text>
<text x="550.0" y="638" font-size="15" fill="#8a8880" text-anchor="middle">seats available &#8212; contention increases to the right &#8594;</text>
<polyline points="150.0,259.8 416.7,412.6 683.3,436.5 950.0,435.1" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="150.0,150.2 416.7,231.9 683.3,227.2 950.0,291.7" fill="none" stroke="#eb6834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
