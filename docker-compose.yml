services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: holdfast
      POSTGRES_PASSWORD: holdfast_dev
      POSTGRES_DB: holdfast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holdfast"]
      interval: 2s
      timeout: 2s
      retries: 15

  api-1:
    build: .
    environment:
      DATABASE_URL: postgres://holdfast:holdfast_dev@db:5432/holdfast
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  api-2:
    build: .
    environment:
      DATABASE_URL: postgres://holdfast:holdfast_dev@db:5432/holdfast
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  api-3:
    build: .
    environment:
      DATABASE_URL: postgres://holdfast:holdfast_dev@db:5432/holdfast
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3

volumes:
  pgdata:
