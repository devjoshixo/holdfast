services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: holdfast
      POSTGRES_PASSWORD: holdfast_dev
      POSTGRES_DB: holdfast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holdfast"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
