events {
    worker_connections 1024;
}

http {
    upstream holdfast_cluster {
        # Round-robin distribution across all 3 replicas
        server api-1:8080;
        server api-2:8080;
        server api-3:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://holdfast_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Telemetry: shows which replica handled the request
            add_header X-Backend-Server $upstream_addr always;
        }
    }
}
